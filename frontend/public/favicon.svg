<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- brand tile -->
  <rect width="100" height="100" rx="26" fill="url(#tile)"/>
  <rect width="100" height="100" rx="26" fill="url(#sheen)"/>

  <!-- hexagon frame, echoing the header logo -->
  <polygon points="50,12 83,30 83,70 50,88 17,70 17,30"
           fill="none" stroke="#ffffff" stroke-opacity=".38"
           stroke-width="5" stroke-linejoin="round"/>

  <!-- the Z mark -->
  <path d="M 34 37 H 66 L 34 63 H 66"
        fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
